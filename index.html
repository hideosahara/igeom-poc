<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGeom - Geometria Dinâmica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>iGeom - Geometria Dinâmica</h1>
            <div class="menu-buttons">
                <button id="btn-save">Salvar</button>
                <button id="btn-load">Carregar</button>
                <button id="btn-clear">Limpar</button>
            </div>
        </header>
        
        <div class="toolbar">
            <button class="tool-btn active" data-tool="select" title="Selecionar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="point" title="Criar Ponto">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="4"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="line" title="Criar Reta">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="20" x2="20" y2="4"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="segment" title="Criar Segmento">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="20" x2="20" y2="4" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="ray" title="Criar Semireta">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="20" x2="20" y2="4" stroke-linecap="round"/>
                    <polygon points="20,4 16,8 16,6 18,4 16,2 16,4"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="circle" title="Criar Circunferência">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="8"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="intersection" title="Interseção">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="10" cy="10" r="6"/>
                    <circle cx="14" cy="14" r="6"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="move" title="Mover">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M15 19l-3 3-3-3"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="hide" title="Esconder">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>
        
        <div class="canvas-container">
            <canvas id="geometry-canvas"></canvas>
        </div>
        
        <div class="status-bar">
            <span id="status-text">Pronto</span>
            <span id="coordinates">X: 0, Y: 0</span>
        </div>
    </div>
    
    <input type="file" id="file-input" accept=".json" style="display: none;">
    
    <script src="geometry/Point.js"></script>
    <script src="geometry/Line.js"></script>
    <script src="geometry/Circle.js"></script>
    <script src="geometry/Segment.js"></script>
    <script src="geometry/Ray.js"></script>
    <script src="geometry/Intersection.js"></script>
    <script src="geometry/IntersectionPoint.js"></script>
    <script src="utils/CoordinateSystem.js"></script>
    <script src="utils/Renderer.js"></script>
    <script src="utils/Collision.js"></script>
    <script src="state/Construction.js"></script>
    <script src="state/ToolManager.js"></script>
    <script src="app.js"></script>
</body>
</html>
